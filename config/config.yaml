world:
  name: intercrop_world
  output_file: worlds/intercrop_world.sdf

# GPS origin for the world. Required for PX4 SITL: without it, gz-sim's
# NavSat system has no real-world reference, EKF2 gets no valid GPS fix, and
# the magnetometer consistency check reports "Strong magnetic interference"
# since the expected field (from WMM) can't be looked up for a real location.
# Defaults match PX4's own default.sdf (Zurich).
spherical_coordinates:
  latitude_deg: 47.397971057728974
  longitude_deg: 8.546163739800146
  elevation: 0.0

field:
  num_rows: 10
  row_length: 10.0
  row_spacing: 1.0
  plant_spacing: 0.25

origin:
  start_x: -5.0
  start_y: 0.0
  plant_z: 0.0

crops:
  even_rows: crop_row_a
  even_rows_collision: false
  odd_rows: crop_row_b
  odd_rows_collision: false

crop_randomization:
  enabled: false

  position:
    x: 0.0
    y: 0.0
    z: 0.0

  orientation: 
    roll: 0.0
    pitch: 0.0
    yaw: 3.14

lighting:
  ambient: [0.7, 0.7, 0.7, 1]
  background: [0.85, 0.9, 1.0, 1]

sun:
  pose: [0, 0, 50, 0, 0, 0]
  diffuse: [1.0, 1.0, 1.0, 1]
  specular: [0.2, 0.2, 0.2, 1]
  direction: [-0.5, 0.1, -1]

ground:
  model: ground
  pose: [0, 0, 0, 0, 0, 0]